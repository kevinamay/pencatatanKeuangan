name: Build Android APK & Native Widget

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Tokyo Neko APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Generate Wrapper & Build Debug APK
        working-directory: android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Locate & Rename APK
        run: |
          mkdir -p output
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} output/tokyo-neko.apk \;
          ls -lh output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tokyo-neko-apk
          path: output/tokyo-neko.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Tokyo Neko FinPlan - Android APK with Native Widget"
          body: |
            ### 📱 Tokyo Neko FinPlan - Android APK Asli (.apk)
            
            Aplikasi Android asli Tokyo Neko FinPlan lengkap dengan **Widget Layar Utama Bawaan (4x2)**.
            
            #### 📦 Cara Pasang di HP:
            1. Download file `tokyo-neko.apk` di bawah ini.
            2. Buka file hasil download di HP Anda dan pilih **Install** (izinkan instalasi dari sumber ini jika diminta).
            3. Buka layar utama HP Anda, cubit/tekan lama area kosong lalu pilih **Widget**.
            4. **Tokyo Neko** sekarang resmi muncul di daftar widget HP Anda berdampingan dengan WhatsApp dan Strava!
            5. Tarik widget ke layar utama untuk memantau saldo live dan 3 cincin aktivitas finansial.
          files: output/tokyo-neko.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
