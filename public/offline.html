<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Koneksi Terputus - Tokyo Neko FinPlan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, sans-serif; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background-color: #FAF7F2;
            color: #1c1917;
        }
        .card {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            border-radius: 1.75rem;
            padding: 2.25rem 2rem;
            border: 1px solid #E8E2D8;
            box-shadow: 0 20px 40px -15px rgba(133, 77, 14, 0.08);
            text-align: center;
        }
        .badge {
            display: inline-block;
            font-size: 0.6875rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            background: #FEF3C7;
            color: #92400E;
            margin-bottom: 1.25rem;
        }
        .icon {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            line-height: 1;
        }
        h1 {
            font-size: 1.3rem;
            font-weight: 900;
            margin-bottom: 0.5rem;
            color: #292524;
        }
        p {
            font-size: 0.85rem;
            line-height: 1.5;
            color: #78716c;
            margin-bottom: 1.75rem;
        }
        .btn-retry {
            width: 100%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.875rem 1.5rem;
            border-radius: 1rem;
            background: #854D0E;
            color: #ffffff;
            font-weight: 700;
            font-size: 0.875rem;
            border: none;
            cursor: pointer;
            box-shadow: 0 10px 20px -5px rgba(133, 77, 14, 0.3);
            transition: all 0.2s ease;
        }
        .btn-retry:hover { background: #713F12; }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">🐾 TOKYO NEKO &bull; OFFLINE MODE</div>
        <div class="icon">🐱💤</div>
        <h1>Tidak Ada Koneksi Internet</h1>
        <p>Aplikasi sedang berada dalam mode offline. Anda dapat terus melihat data tampilan yang tersimpan dalam memori lokal HP Anda.</p>
        <button class="btn-retry" onclick="window.location.reload()">
            Muat Ulang Halaman
        </button>
    </div>
    <script>
        window.addEventListener('online', () => { window.location.reload(); });
    </script>
</body>
</html>
